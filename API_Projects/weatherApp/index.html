<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>

<body>
  <main>
    <section class="area-weather">

      <div class="area-weather-header">
        <p class="area-weather-local" id="local">
          Pesquise uma cidade
        </p>

        <span class="area-weather-conditions" id="conditions">
          --
        </span>
      </div>

      <div class="area-weather-temps">

        <span class="area-weather-temp" id="temp">
          --°
        </span>

        <div class="area-weather-minmax">
          <span class="area-weather-tempmax" id="tempMax">
            Máx: --°
          </span>

          <span class="area-weather-tempmin" id="tempMin">
            Mín: --°
          </span>
        </div>

      </div>

    </section>

    <div class="area-input">
      <input class="input" id="inputLocation" type="text" placeholder="Digite uma cidade..." />
    </div>
  </main>
  
  <script>
    const inputLocation = document.getElementById("inputLocation");

    const local = document.getElementById("local");
    const conditions = document.getElementById("conditions");
    const temp = document.getElementById("temp");
    const tempMax = document.getElementById("tempMax");
    const tempMin = document.getElementById("tempMin");

    async function getWeather(location) {
      try {
        const response = await fetch(
          `https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/${encodeURIComponent(location)}?unitGroup=metric&lang=pt&key=API_AQUI`
        );

        if (!response.ok) {
          throw new Error("Localização não encontrada");
        }

        const weatherData = await response.json();

        return weatherData;

      } catch (error) {
        console.error(error);

        local.textContent = "Localização não encontrada";
        conditions.textContent = "";
        temp.textContent = "--°";
        tempMax.textContent = "";
        tempMin.textContent = "";

        return null;
      }
    }

    function showWeather(weatherData) {
      const current = weatherData.currentConditions;
      const today = weatherData.days[0];

      local.textContent = weatherData.resolvedAddress;
      conditions.textContent = current.conditions;

      temp.textContent = `${Math.round(current.temp)}°C`;

      tempMax.textContent = `Máx: ${Math.round(today.tempmax)}°`;
      tempMin.textContent = `Mín: ${Math.round(today.tempmin)}°`;
    }

    inputLocation.addEventListener("change", async () => {
      const location = inputLocation.value.trim();

      if (!location) return;

      const weatherData = await getWeather(location);

      if (weatherData) {
        showWeather(weatherData);
      }
    });


  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e3a8a
        );

      color: white;
    }

    main {
      width: 100%;
      max-width: 450px;

      display: flex;
      flex-direction: column;

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .area-weather {
      width: 100%;
      min-height: 330px;

      padding: 30px;

      display: flex;
      flex-direction: column;

      background:
        linear-gradient(
          135deg,
          #38bdf8,
          #2563eb
        );
    }

    .area-weather-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;
    }

    .area-weather-local {
      font-size: 1.2rem;
      font-weight: 600;

      max-width: 60%;
    }

    .area-weather-conditions {
      font-size: 0.9rem;

      text-align: right;

      opacity: 0.85;
    }

    .area-weather-temps {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .area-weather-temp {
      font-size: clamp(4rem, 15vw, 6rem);

      font-weight: 300;

      letter-spacing: -5px;
    }

    .area-weather-minmax {
      display: flex;

      gap: 15px;

      font-size: 0.95rem;

      opacity: 0.85;
    }

    .area-input {
      width: 100%;

      padding: 15px 20px;

      background-color: white;
    }

    .input {
      width: 100%;

      padding: 12px 15px;

      border: 1px solid #d1d5db;
      border-radius: 10px;

      outline: none;

      font-size: 1rem;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    .input::placeholder {
      color: #9ca3af;
    }

    .input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.15);
    }


    /* Responsividade */

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .area-weather {
        min-height: 280px;

        padding: 25px;
      }

      .area-weather-header {
        flex-direction: column;

        gap: 5px;
      }

      .area-weather-local {
        max-width: 100%;
      }

      .area-weather-conditions {
        text-align: left;
      }

      .area-weather-temp {
        font-size: 4rem;
      }
    }
  </style>
</body>

</html>
